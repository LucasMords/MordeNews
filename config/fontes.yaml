# Fontes de coleta, agrupadas por módulo.
#
# Formato de cada fonte:
#   - nome: nome-curto-unico        # minúsculas, números e hífen; vira o campo `fonte` do item
#     tipo: rss                     # rss | github (issues de um repositório) | iel (mural do IEL)
#     url: https://exemplo.com/feed
#     janela_horas: 72              # opcional; só itens publicados nas últimas N horas (padrão 72)
#     limite: 50                    # opcional; máximo de itens por execução (padrão e teto: 50)
#
# Lista de notícias aprovada pelo usuário em 2026-11-18. Todas foram checadas: o feed responde
# e o robots.txt permite coleta. Lobsters e Canaltech ficaram de fora porque o robots.txt bloqueia.

noticias:
  # Tech/dev geral (EN)
  - nome: hacker-news
    tipo: rss
    url: https://hnrss.org/newest?points=150   # só posts com 150+ pontos
  - nome: ars-technica
    tipo: rss
    url: https://feeds.arstechnica.com/arstechnica/index
  - nome: the-verge
    tipo: rss
    url: https://www.theverge.com/rss/index.xml
  - nome: mit-technology-review
    tipo: rss
    url: https://www.technologyreview.com/feed/

  # IA (EN)
  - nome: simon-willison
    tipo: rss
    url: https://simonwillison.net/atom/everything/
  - nome: hugging-face-blog
    tipo: rss
    url: https://huggingface.co/blog/feed.xml

  # Dev e segurança (EN)
  - nome: github-blog
    tipo: rss
    url: https://github.blog/feed/
  - nome: the-hacker-news
    tipo: rss
    url: https://feeds.feedburner.com/TheHackersNews

  # Brasil (PT)
  - nome: tecnoblog
    tipo: rss
    url: https://tecnoblog.net/feed/
  - nome: tabnews
    tipo: rss
    url: https://www.tabnews.com.br/recentes/rss

# Estágios: fontes aprovadas pelo usuário em 2026-11-19. Só canais oficiais e abertos.
# Ficaram de fora: LinkedIn, Instagram, Indeed, Catho, Vagas.com.br (bloqueiam robôs ou proíbem
# nos termos), Remotar (os termos proíbem robôs/crawlers) e CIEE (só API interna, sem documentação).
estagios:
  # Só tecnologia. A maioria é pleno/sênior; a triagem dá nota baixa a essas.
  - nome: programathor
    tipo: rss
    url: https://programathor.com.br/jobs.rss

  # Comunidades que publicam uma vaga por issue (API REST oficial do GitHub).
  - nome: gh-backend-br
    tipo: github
    url: https://api.github.com/repos/backend-br/vagas   # o mais ativo (~40 vagas/mês)
  - nome: gh-frontendbr
    tipo: github
    url: https://api.github.com/repos/frontendbr/vagas
  - nome: gh-react-brasil
    tipo: github
    url: https://api.github.com/repos/react-brasil/vagas
  - nome: gh-nodejsdevbr
    tipo: github
    url: https://api.github.com/repos/nodejsdevbr/vagas
  - nome: gh-phpdevbr
    tipo: github
    url: https://api.github.com/repos/phpdevbr/vagas
  - nome: gh-soujava
    tipo: github
    url: https://api.github.com/repos/soujava/vagas-java
  - nome: gh-dotnetdevbr
    tipo: github
    url: https://api.github.com/repos/dotnetdevbr/vagas
  - nome: gh-androiddevbr
    tipo: github
    url: https://api.github.com/repos/androiddevbr/vagas
  - nome: gh-devops-brasil
    tipo: github
    url: https://api.github.com/repos/DevOps-Brasil/Vagas
  - nome: gh-qa-brasil
    tipo: github
    url: https://api.github.com/repos/qa-brasil/vagas

  # Mural de estágios do IEL Tocantins. Lê o sitemap.xml oficial (o robots.txt só bloqueia /api/).
  # As vagas ficam abertas por semanas, por isso a janela maior.
  - nome: iel-tocantins
    tipo: iel
    url: https://carreiras.iel.org.br/TO
    janela_horas: 336
concursos: []
