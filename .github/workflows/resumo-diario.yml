name: resumo-diario

on:
  schedule:
    # Cron do GitHub é em UTC (Brasília = UTC−3). Horários pedidos pelo usuário em 2026-11-20.
    - cron: "2 11 * * *"   # 08:02 BRT: resumo do dia
    - cron: "4 18 * * *"   # 15:04 BRT: reserva, só envia se o das 08h falhou ou não rodou
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resumo-diario
  cancel-in-progress: false

jobs:
  resumo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
      EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
      EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
      NOTA_MINIMA_RESUMO: ${{ vars.NOTA_MINIMA_RESUMO }}   # opcional (aba Variables); vazio = 6
      RESUMO_MAXIMO: ${{ vars.RESUMO_MAXIMO }}             # opcional (aba Variables); vazio = 30
      NOTA_MINIMA_ESTAGIOS: ${{ vars.NOTA_MINIMA_ESTAGIOS }} # opcional; vazio = 0 (todas as vagas)
      ESTAGIOS_MAXIMO: ${{ vars.ESTAGIOS_MAXIMO }}         # opcional; vazio = 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen --no-dev

      - name: Enviar resumo por e-mail
        env:
          RESERVA: ${{ github.event.schedule == '4 18 * * *' && '--reserva' || '' }}
        run: uv run --frozen --no-dev radar resumo $RESERVA
