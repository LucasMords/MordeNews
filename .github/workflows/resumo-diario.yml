name: resumo-diario

# Coleta, tria e envia no mesmo job, para o e-mail sair com o que acabou de ser coletado
# (pedido do usuário em 2026-11-20). Um cron atrasado ou pulado não deixa mais o resumo
# sem coleta.
on:
  schedule:
    # Cron do GitHub é em UTC (Brasília = UTC−3). Horários pedidos pelo usuário em 2026-11-20.
    - cron: "2 11 * * *"   # 08:02 BRT: resumo do dia
    - cron: "4 18 * * *"   # 15:04 BRT: reserva, só envia se o das 08h falhou ou não rodou
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resumo-diario
  cancel-in-progress: false

jobs:
  resumo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RADAR_CONTATO: ${{ secrets.RADAR_CONTATO }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # automático; usado pelo coletor de vagas
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}   # opcional (aba Variables); vazio = padrão do código
      EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
      EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
      EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
      NOTA_MINIMA_RESUMO: ${{ vars.NOTA_MINIMA_RESUMO }}   # opcional (aba Variables); vazio = 6
      RESUMO_MAXIMO: ${{ vars.RESUMO_MAXIMO }}             # opcional (aba Variables); vazio = 30
      NOTA_MINIMA_ESTAGIOS: ${{ vars.NOTA_MINIMA_ESTAGIOS }} # opcional; vazio = 0 (todas as vagas)
      ESTAGIOS_MAXIMO: ${{ vars.ESTAGIOS_MAXIMO }}         # opcional; vazio = 15
      NOTA_MINIMA_CONCURSOS: ${{ vars.NOTA_MINIMA_CONCURSOS }} # opcional; vazio = 0 (todos)
      PORTAL_URL: ${{ vars.PORTAL_URL }}   # opcional (aba Variables); links de voto no e-mail
      CONCURSOS_MAXIMO: ${{ vars.CONCURSOS_MAXIMO }}       # opcional; vazio = 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen --no-dev

      - name: Coletar todas as fontes
        run: uv run --frozen --no-dev radar coletar --todos

      # O perfil é privado (repositório público): vem do secret PERFIL_MD e só existe durante a execução.
      - name: Recriar perfil a partir do secret
        if: ${{ !cancelled() }}
        env:
          PERFIL_MD: ${{ secrets.PERFIL_MD }}
        run: printf '%s\n' "$PERFIL_MD" > config/perfil.md

      # Roda mesmo se a coleta falhar: pode haver pendentes de execuções anteriores.
      - name: Triar pendentes com IA
        if: ${{ !cancelled() }}
        run: uv run --frozen --no-dev radar triar

      # Envia mesmo se a coleta ou a triagem falharem: o que já está triado no banco sai.
      - name: Enviar resumo por e-mail
        if: ${{ !cancelled() }}
        env:
          RESERVA: ${{ github.event.schedule == '4 18 * * *' && '--reserva' || '' }}
        run: uv run --frozen --no-dev radar resumo $RESERVA

      # Inscrições terminando em até 3 dias. No máximo um alerta por dia (confere em `execucoes`).
      - name: Alertar prazos de inscrição
        if: ${{ !cancelled() }}
        run: uv run --frozen --no-dev radar alertas-prazo

      # Bloco 9: avisa fontes falhando 2 vezes seguidas ou há 3 dias sem itens novos.
      # No máximo uma verificação por dia; cada problema é avisado uma vez (de novo após 7 dias).
      - name: Monitorar fontes
        if: ${{ !cancelled() }}
        run: uv run --frozen --no-dev radar monitorar
